services:
  codex-broker:
    build:
      context: ..
      args:
        CODEX_VERSION: "0.153.2"
    image: codex-broker:local
    environment:
      CODEX_BROKER_ALLOWED_WORKSPACE_ROOTS: "/workspaces:/host-data"
      CODEX_BROKER_ALLOWED_TOOL_COMMANDS: "python,node"
      CODEX_BROKER_ALLOWED_HOSTED_TOOL_URL_PREFIXES: "http://app:3000,http://host.docker.internal,http://127.0.0.1"
      # Conservative defaults for a small host. Raise only after measuring
      # cgroup memory and process counts under representative concurrency.
      CODEX_BROKER_MAX_ACTIVE_TURNS: "2"
      CODEX_BROKER_MAX_POOLED_APP_SERVERS: "2"
      CODEX_BROKER_POOL_IDLE_TTL_SECONDS: "120"
      CODEX_HOST_TOOL_KEY: "${CODEX_HOST_TOOL_KEY:-}"
    read_only: true
    security_opt:
      - no-new-privileges:true
      # Installed by scripts/install-host-security-profiles.sh. Docker reads
      # this host path before the container image starts.
      - seccomp=/etc/codex-broker/security/v1/seccomp.json
    tmpfs:
      - /tmp
    volumes:
      - codex-broker-data:/data
      # A deliberately narrow, empty sample workspace. Replace only with the
      # specific job or project directory this broker is authorized to change.
      - ./workspace:/workspaces/app:rw
      - job-data:/host-data/jobs:rw
      - ./bundles:/bundles:ro
    secrets:
      - codex_broker_key
    restart: unless-stopped

volumes:
  codex-broker-data:
  job-data:

secrets:
  codex_broker_key:
    file: ./secrets/codex_broker_key.example
